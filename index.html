<!DOCTYPE html>
<html>
<head>
    <title>My Flappy Bird Game</title>

    <style>
        body {
            background-color: lightgray;
            text-align: center;
            font-family: Arial;
        }

        canvas {
            background-color: skyblue;
            border: 3px solid black;
        }

        h1 {
            color: darkgreen;
        }
    </style>
</head>

<body>

    <h1>Flappy Bird</h1>

    <p>Press SPACE to fly!</p>

    <canvas id="game" width="400" height="500"></canvas>

    <p>Score: <span id="score">0</span></p>

    <script>

        // Game setup

        let canvas = document.getElementById("game");
        let ctx = canvas.getContext("2d");

        let score = 0;
        let gameOver = false;

        // Bird

        let bird = {
            x: 80,
            y: 200,
            size: 30,
            velocity: 0,
            gravity: 0.4,
            jump: -7
        };

        // Pipes

        let pipes = [];

        let pipeWidth = 60;
        let pipeGap = 150;

        // Create pipes

        function createPipe() {

            let gapY = Math.random() * 250 + 100;

            pipes.push({
                x: 400,
                gapY: gapY,
                passed: false
            });

        }

        createPipe();

        // Draw bird

        function drawBird() {

            ctx.fillStyle = "yellow";

            ctx.beginPath();

            ctx.arc(
                bird.x,
                bird.y,
                bird.size / 2,
                0,
                Math.PI * 2
            );

            ctx.fill();

            // Bird eye

            ctx.fillStyle = "black";

            ctx.beginPath();

            ctx.arc(
                bird.x + 7,
                bird.y - 5,
                3,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }

        // Draw pipes

        function drawPipes() {

            ctx.fillStyle = "green";

            pipes.forEach(function(pipe) {

                // Upper pipe

                ctx.fillRect(
                    pipe.x,
                    0,
                    pipeWidth,
                    pipe.gapY
                );

                // Lower pipe

                ctx.fillRect(
                    pipe.x,
                    pipe.gapY + pipeGap,
                    pipeWidth,
                    500
                );

            });

        }

        // Collision detection

        function checkCollision(pipe) {

            let birdLeft = bird.x - bird.size / 2;
            let birdRight = bird.x + bird.size / 2;

            let birdTop = bird.y - bird.size / 2;
            let birdBottom = bird.y + bird.size / 2;

            let pipeLeft = pipe.x;
            let pipeRight = pipe.x + pipeWidth;

            if (
                birdRight > pipeLeft &&
                birdLeft < pipeRight
            ) {

                if (
                    birdTop < pipe.gapY ||
                    birdBottom > pipe.gapY + pipeGap
                ) {

                    return true;

                }

            }

            return false;

        }

        // Game loop

        function gameLoop() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            if (!gameOver) {

                // Gravity

                bird.velocity += bird.gravity;

                bird.y += bird.velocity;

                // Move pipes

                pipes.forEach(function(pipe) {

                    pipe.x -= 2;

                    // Score

                    if (
                        !pipe.passed &&
                        pipe.x + pipeWidth < bird.x
                    ) {

                        score++;

                        pipe.passed = true;

                        document.getElementById("score").innerText = score;

                    }

                    // Collision

                    if (checkCollision(pipe)) {

                        gameOver = true;

                    }

                });

                // Remove old pipes

                pipes = pipes.filter(function(pipe) {

                    return pipe.x + pipeWidth > 0;

                });

                // Create new pipes

                if (
                    pipes.length === 0 ||
                    pipes[pipes.length - 1].x < 220
                ) {

                    createPipe();

                }

                // Ground and ceiling

                if (
                    bird.y + bird.size / 2 > 500 ||
                    bird.y - bird.size / 2 < 0
                ) {

                    gameOver = true;

                }

            }

            // Draw everything

            drawPipes();

            drawBird();

            // Game Over screen

            if (gameOver) {

                ctx.fillStyle = "black";

                ctx.font = "35px Arial";

                ctx.fillText(
                    "GAME OVER",
                    90,
                    230
                );

                ctx.font = "18px Arial";

                ctx.fillText(
                    "Press SPACE to restart",
                    100,
                    270
                );

            }

            requestAnimationFrame(gameLoop);

        }

        // Keyboard controls

        document.addEventListener("keydown", function(event) {

            if (event.code === "Space") {

                event.preventDefault();

                if (gameOver) {

                    // Restart game

                    bird.y = 200;
                    bird.velocity = 0;

                    pipes = [];

                    score = 0;

                    gameOver = false;

                    document.getElementById("score").innerText = score;

                    createPipe();

                } else {

                    // Bird jumps

                    bird.velocity = bird.jump;

                }

            }

        });

        // Start game

        gameLoop();

    </script>

</body>
</html>
